<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>abaplint.app works on GitHub, the VS Code extension and abaplint CLI work on the files, abaplint-abap-classic runs on stack inside the SAP system, VS Code and Eclipse connect to the SAP system; GitHub, files, abapGit and the SAP system are connected in both directions</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="320" rx="12" fill="#f6f8fa"/>

  <!-- abaplint.app -->
  <rect x="25" y="20" width="150" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="100" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">abaplint.app</text>

  <line x1="100" y1="84" x2="100" y2="116" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="112" y="104" font-size="12" fill="#57606a">checks PRs</text>

  <!-- VS Code extension -->
  <rect x="225" y="20" width="150" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="300" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">VS Code</text>
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#57606a">abaplint extension</text>

  <line x1="300" y1="84" x2="300" y2="116" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GitHub -->
  <rect x="25" y="120" width="150" height="80" rx="10" fill="#24292f"/>
  <text x="100" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">GitHub</text>

  <line x1="179" y1="160" x2="221" y2="160" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- files -->
  <rect x="225" y="120" width="150" height="80" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="300" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">ABAP as files</text>

  <line x1="379" y1="160" x2="421" y2="160" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- abapGit -->
  <rect x="425" y="120" width="150" height="80" rx="10" fill="#e8723a"/>
  <text x="500" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">abapGit</text>

  <line x1="579" y1="160" x2="621" y2="160" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- VS Code and Eclipse, connected to the SAP system -->
  <rect x="625" y="20" width="100" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="675" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">VS Code</text>
  <line x1="675" y1="84" x2="675" y2="106" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="735" y="20" width="100" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="785" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">Eclipse</text>
  <line x1="785" y1="84" x2="785" y2="106" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SAP system, with abaplint-abap-classic on stack -->
  <rect x="625" y="110" width="210" height="190" rx="10" fill="#0a6ebd"/>
  <text x="730" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">SAP system</text>

  <rect x="640" y="180" width="180" height="100" rx="8" fill="#ffffff"/>
  <text x="730" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">abaplint-abap-classic</text>
  <text x="730" y="244" text-anchor="middle" font-size="12" fill="#57606a">on stack, SCI / ATC</text>

  <!-- abaplint CLI -->
  <line x1="300" y1="236" x2="300" y2="204" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="225" y="240" width="150" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="300" y="267" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">abaplint</text>
  <text x="300" y="286" text-anchor="middle" font-size="12" fill="#57606a">command line</text>
</svg>
