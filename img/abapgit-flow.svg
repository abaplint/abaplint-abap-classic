<svg xmlns="http://www.w3.org/2000/svg" width="933" height="370" viewBox="0 0 933 370" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The VS Code extension and abaplint CLI work on the files, abaplint.app works on GitHub, abapGit and abaplint-abap-classic run inside the SAP system, VS Code, Eclipse and SE80 connect to the SAP system; files, GitHub and abapGit are connected in both directions</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="933" height="370" rx="12" fill="#f6f8fa"/>

  <!-- VS Code extension -->
  <rect x="25" y="20" width="150" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="100" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">VS Code</text>
  <text x="100" y="66" text-anchor="middle" font-size="12" fill="#57606a">abaplint extension</text>

  <line x1="100" y1="84" x2="100" y2="156" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- abaplint.app -->
  <rect x="225" y="20" width="150" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="300" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">abaplint.app</text>

  <line x1="300" y1="84" x2="300" y2="156" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="312" y="124" font-size="12" fill="#57606a">checks PRs</text>

  <!-- files -->
  <rect x="25" y="160" width="150" height="80" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="100" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">ABAP as files</text>

  <line x1="179" y1="200" x2="221" y2="200" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- GitHub -->
  <rect x="225" y="160" width="150" height="80" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="300" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">GitHub</text>

  <!-- VS Code and Eclipse, connected to the SAP system -->
  <rect x="416" y="20" width="150" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="491" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">VS Code</text>
  <text x="491" y="66" text-anchor="middle" font-size="12" fill="#57606a">SAP extension</text>
  <line x1="491" y1="84" x2="491" y2="106" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="580" y="20" width="150" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="655" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">Eclipse</text>
  <text x="655" y="66" text-anchor="middle" font-size="12" fill="#57606a">ADT</text>
  <line x1="655" y1="84" x2="655" y2="106" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="744" y="20" width="150" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="819" y="47" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">SE80</text>
  <text x="819" y="66" text-anchor="middle" font-size="12" fill="#57606a">SAP GUI</text>
  <line x1="819" y1="84" x2="819" y2="106" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SAP system, with abapGit and abaplint-abap-classic on stack -->
  <rect x="402" y="110" width="506" height="170" rx="10" fill="#0a6ebd"/>
  <text x="426" y="140" font-size="18" font-weight="700" fill="#ffffff">SAP system</text>

  <rect x="430" y="160" width="210" height="80" rx="8" fill="#ffffff"/>
  <text x="535" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#24292f">abapGit</text>

  <rect x="670" y="160" width="210" height="80" rx="8" fill="#ffffff"/>
  <text x="775" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">abaplint-abap-classic</text>
  <text x="775" y="218" text-anchor="middle" font-size="12" fill="#57606a">on stack, SCI / ATC</text>

  <!-- GitHub to abapGit -->
  <line x1="379" y1="200" x2="402" y2="200" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)"/>
  <line x1="402" y1="200" x2="426" y2="200" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow-white)"/>

  <!-- abaplint CLI -->
  <line x1="100" y1="286" x2="100" y2="244" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="25" y="290" width="150" height="60" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="100" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#24292f">abaplint</text>
  <text x="100" y="336" text-anchor="middle" font-size="12" fill="#57606a">command line</text>
</svg>
